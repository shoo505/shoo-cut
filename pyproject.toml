[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shoo-cut"
version = "1.0.0"
description = "Automatic, evenly distributed cuts from long local video recordings, exported at 720p."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shoo Auto Cut" }]
keywords = ["video", "ffmpeg", "autocut", "editing"]
classifiers = [
    "Environment :: Web Environment",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.scripts]
shoo-cut = "shoo_cut.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["shoo_cut*"]

[tool.setuptools.package-data]
shoo_cut = ["static/*"]
