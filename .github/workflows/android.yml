
name: Shoo Auto Cut Android APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Shoo Auto Cut APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # 1. Checkout actual repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Android SDK components
      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      # 5. Verify project structure
      - name: Verify Android project
        run: |
          echo "Checking repository..."

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: Gradle wrapper not found."
            echo "This repository does not have a root-level Gradle wrapper."
            exit 1
          fi

          if [ ! -f "./settings.gradle" ] && \
             [ ! -f "./settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          chmod +x ./gradlew

          echo "Project structure verified."

      # 6. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 7. Build APK
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 8. Verify APK output
      - name: Verify APK
        run: |
          echo "Searching for generated APK..."

          find . -type f \
            -path "*/build/outputs/apk/debug/*.apk"

          APK_COUNT=$(find . -type f \
            -path "*/build/outputs/apk/debug/*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK generated successfully."

      # 9. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shoo-auto-cut-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 10. Build summary
      - name: Build Summary
        if: always()
        run: |
          echo "## Shoo Auto Cut Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ job.status }}" = "success" ]; then
            echo "Build completed successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build failed. Check the logs." >> "$GITHUB_STEP_SUMMARY"
          fi
  
