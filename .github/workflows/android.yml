name: Shoo Auto Cut Android APK Build

"on":
push:
branches:
- main
pull_request:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build-apk:
name: Build Shoo Auto Cut APK
runs-on: ubuntu-latest
timeout-minutes: 180

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v4

  - name: Install Android SDK
    run: |
      sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

  - name: Setup Gradle 8.2
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.2'

  - name: Verify Gradle
    run: gradle --version

  - name: Run Unit Tests
    run: gradle testDebugUnitTest --no-daemon --stacktrace

  - name: Build APK
    run: gradle assembleDebug --no-daemon --stacktrace

  - name: Verify APK
    run: |
      APK_COUNT=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | wc -l)
      if [ "$APK_COUNT" -eq 0 ]; then
        echo "ERROR: APK was not generated"
        exit 1
      fi
      find . -type f -path "*/build/outputs/apk/debug/*.apk" -exec ls -lh {} \;

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: shoo-auto-cut-debug-apk
      path: "**/build/outputs/apk/debug/*.apk"
      if-no-files-found: error
      retention-days: 30
